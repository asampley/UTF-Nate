<head>
	{% include "head.html" %}
	<script>
		function update_link(event) {
			const form = document.forms[0];

			const formData = new FormData(form);
			console.log(formData);

			const link = document.getElementById("command-link");

			link.href = "/{{ command.identifying_name }}/run?" + new URLSearchParams(formData).toString();
			link.innerHTML = link.href;
		}

		document.addEventListener("DOMContentLoaded", update_link);
	</script>
</head>
<body hx-ext="loading-states">
	<h1>{{ command.identifying_name }}</h1>
	<form
		hx-get="/{{ command.identifying_name }}/run"
		hx-target="#response"
		hx-indicator="#indicator"
	>
		{% for p in command.parameters %}
		<label for="{{ p.name }}">{{ p.name }}</label>
		<input type="text" name="{{ p.name }}" oninput="update_link(event)"/>
		{% endfor %}
		<button type="submit" data-loading-disable>Submit</button>
	</form>
	<img id="indicator" class="indicator" src="/img/loading.svg"/>
	<div id="response" data-loading-class="hide"></div>
	<div id="replay">
		<p>
			Copy this link to replay the same command at any time
		</p>
		<p>
			<a id="command-link"></a>
		</p>
	</div>
	{{ help|safe }}
</body>
